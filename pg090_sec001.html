        <p class="adt-body leading-snug"><span data-id="pg090_n0005">1. Who were the main characters?</span></p>

      </div>

      <div>
        <p class="adt-body leading-snug"><span data-id="pg090_n0006">2. What happened at the beginning of the story?</span></p>
        <textarea class="mt-1 w-full rounded border border-gray-300 bg-white px-3 py-2 leading-7 resize-none min-h-[4.5rem] max-sm:min-h-[4rem]" data-aria-id="aria-1-0-1" aria-label="Answer to question 2 about the beginning of the story" tabindex="0"></textarea>

      </div>
